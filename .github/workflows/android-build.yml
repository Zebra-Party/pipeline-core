name: Android Build

# Reusable workflow: Android APK build. Produces a debug-signed (sideloadable)
# APK as a workflow artifact, and optionally attaches it to the GitHub Release
# for the version being shipped. Play Store upload is deferred.
#
# Usage:
#   jobs:
#     android:
#       needs: gate
#       uses: Zebra-Party/pipeline-core/.github/workflows/android-build.yml@v1
#       with:
#         godot_version: "4.6.2-stable"
#         app_name: "GameTwo"
#         version: ${{ needs.gate.outputs.version }}
#         build: ${{ needs.gate.outputs.build }}
#         attach_to_release: true
#       secrets: inherit

on:
  workflow_call:
    inputs:
      godot_version:
        type: string
        default: "4.6.2-stable"
      runner:
        description: 'JSON array of runner labels'
        type: string
        default: '["self-hosted", "macOS", "ephemeral"]'
      app_name:
        description: "Base filename for the APK (no extension)"
        type: string
        default: "export"
      android_preset:
        description: "Godot export preset name for Android"
        type: string
        default: "Android"
      pre_export_script:
        description: "Optional project script to run before Godot export"
        type: string
        default: ""
      version:
        description: >-
          Version to build, from release-gate.yml. When empty the workflow
          computes it itself (back-compat). Passing it from the gate means every
          platform job in a release shares one version and one build number.
        type: string
        default: ""
      build:
        description: "Build number, from release-gate.yml. Empty = compute locally."
        type: string
        default: ""
      attach_to_release:
        description: >-
          Attach the APK to the GitHub Release v{version}, creating the release
          if the Apple jobs haven't yet. Requires `version` to be passed.
          Default false — existing callers keep artifact-only behaviour.
        type: boolean
        default: false

      shell:
        description: >-
          Shell for every run step. Leave as 'bash' on macOS/Linux. On the
          self-hosted Windows box you MUST pass the absolute Git Bash path:
          'shell: bash' resolves there to WSL's system32 bash (no distro
          installed) and every step dies. See docs/windows-runners.md.
        type: string
        default: bash
jobs:
  android:
    name: Android build
    runs-on: ${{ fromJSON(inputs.runner) }}
    defaults:
      run:
        shell: ${{ inputs.shell }}
    timeout-minutes: 45
    env:
      GODOT_VERSION: ${{ inputs.godot_version }}
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - uses: actions/checkout@v6
        with:
          repository: Zebra-Party/pipeline-core
          # Pin scripts to the major tag this workflow ships under. Do NOT use
          # github.workflow_sha: in a reusable (workflow_call) context it resolves
          # to the CALLER's commit, which is not a ref in this repo (broke every
          # consumer release in #36). Bump this literal to v2 on the v2 branch.
          ref: v1
          path: .pipeline-core

      - uses: actions/setup-java@v5
        with:
          java-version: "17"
          distribution: temurin

      - name: Setup Android SDK
        uses: android-actions/setup-android@v3

      - name: Install Godot
        run: bash .pipeline-core/scripts/install_godot.sh "$GODOT_VERSION"

      # A debug export is signed with the Android debug keystore. A fresh CI
      # runner has no ~/.android/debug.keystore, and without one Godot fails the
      # export with an unhelpful bare "configuration errors" and no detail. Mint
      # the standard debug keystore (the alias/passwords below are Android's
      # well-known fixed debug values, not secrets) and point Godot at it.
      - name: Create the Android debug keystore
        run: |
          KS="$HOME/.android/debug.keystore"
          mkdir -p "$(dirname "$KS")"
          if [ ! -f "$KS" ]; then
            keytool -genkeypair -v \
              -keystore "$KS" \
              -storepass android -keypass android \
              -alias androiddebugkey \
              -keyalg RSA -keysize 2048 -validity 10000 \
              -dname "CN=Android Debug,O=Android,C=US"
          fi
          echo "KEYSTORE=$KS" >> "$GITHUB_ENV"

      - name: Configure Godot's Android SDK paths
        run: |
          CFG="$HOME/.config/godot/editor_settings-4.tres"
          mkdir -p "$(dirname "$CFG")"
          cat > "$CFG" <<EOF
          [gd_resource type="EditorSettings" format=3]
          [resource]
          export/android/android_sdk_path = "$ANDROID_SDK_ROOT"
          export/android/java_sdk_path = "$JAVA_HOME"
          export/android/debug_keystore = "$KEYSTORE"
          export/android/debug_keystore_user = "androiddebugkey"
          export/android/debug_keystore_pass = "android"
          EOF

      - name: Resolve version
        id: version
        env:
          VERSION_IN: ${{ inputs.version }}
          BUILD_IN: ${{ inputs.build }}
        run: |
          if [ -n "$VERSION_IN" ]; then
            echo "Using version from release gate: $VERSION_IN (build $BUILD_IN)"
            {
              echo "version=$VERSION_IN"
              echo "build=$BUILD_IN"
            } >> "$GITHUB_OUTPUT"
          else
            bash .pipeline-core/scripts/compute_version.sh
          fi

      - name: Apply version to project + presets
        run: bash .pipeline-core/scripts/set_version.sh "${{ steps.version.outputs.version }}" "${{ steps.version.outputs.build }}"

      - name: Reimport
        run: bash .pipeline-core/scripts/godot_import.sh

      - name: Pre-export script
        if: inputs.pre_export_script != ''
        run: bash ${{ inputs.pre_export_script }}

      # Gradle builds need the Android build template installed into the project
      # ("Install Android Build Template" in the editor); without it the export
      # dies with "Android build template not installed in the project". We don't
      # need gradle — a plain APK export uses the prebuilt export template — so
      # turn it off and switch AAB (format=1) to APK (format=0).
      #
      # perl, not `sed -i`: this runs on macOS, whose BSD sed reads the argument
      # after -i as a backup SUFFIX, so `sed -i 's|…|…|' file` fails outright.
      # It did, silently, because the commands ended in `|| true` — gradle stayed
      # on and the export failed with the misleading message above. perl -pi -e
      # behaves identically on macOS and Linux. No `|| true`: if this can't do its
      # job, fail here rather than 40 lines later.
      - name: Disable gradle_build (plain APK export)
        run: |
          set -euo pipefail
          perl -pi -e 's|^gradle_build/use_gradle_build=true|gradle_build/use_gradle_build=false|' export_presets.cfg
          perl -pi -e 's|^gradle_build/export_format=1|gradle_build/export_format=0|' export_presets.cfg
          # Godot rejects min/target SDK overrides unless gradle build is on
          # ('"Min SDK" can only be overridden when "Use Gradle Build" is
          # enabled'), so clear them alongside it. Empty = use the export
          # template's defaults.
          perl -pi -e 's|^gradle_build/min_sdk=.*|gradle_build/min_sdk=""|' export_presets.cfg
          perl -pi -e 's|^gradle_build/target_sdk=.*|gradle_build/target_sdk=""|' export_presets.cfg
          echo "--- gradle settings now:"
          grep -E '^gradle_build/(use_gradle_build|export_format|min_sdk|target_sdk)' export_presets.cfg
          if grep -q '^gradle_build/use_gradle_build=true' export_presets.cfg; then
            echo "::error::Failed to disable gradle_build — the export would fail asking for the build template."
            exit 1
          fi

      - name: Godot export (APK)
        # DELIBERATELY --export-debug, not --export-release. A debug export is
        # signed with Godot's built-in debug keystore, which is what makes the
        # APK installable by anyone who downloads it (sideloading). A release
        # export needs a real upload keystore we don't have wired up yet, and
        # an unsigned APK won't install at all. Do NOT "fix" this to
        # --export-release without adding keystore secrets first.
        run: |
          mkdir -p build/android
          "$GODOT" --headless --path . \
            --export-debug "${{ inputs.android_preset }}" "build/android/${{ inputs.app_name }}.apk"
          ls -la build/android/

      - name: Upload APK as artifact
        uses: actions/upload-artifact@v4
        with:
          name: android-apk
          path: build/android/*.apk
          if-no-files-found: warn
          retention-days: 14

      - name: Attach APK to GitHub Release
        # The workflow artifact above expires after 14 days and needs a GitHub login
        # to download; attaching to the release gives the APK a permanent, directly
        # downloadable home.
        #
        # GitHub seals a published release (immutable), so an asset CANNOT be added
        # after the fact — `gh release upload` returns HTTP 422. The old code assumed
        # view-or-create-then-upload was race-safe; it is not. If an Apple job wins the
        # race and publishes v{version} first, the APK is locked out for good (that is
        # exactly how MumsSudoku shipped a release with no APK).
        #
        # So: create the release WITH the asset in a single call. Consumers additionally
        # order their Apple jobs after this one (`needs: [android]`) so we always get
        # there first. If we somehow don't, fail loudly rather than ship an APK-less
        # release and call it success.
        if: >-
          inputs.attach_to_release &&
          inputs.version != '' &&
          github.event_name != 'pull_request'
        env:
          GITHUB_TOKEN: ${{ github.token }}
          APK_PATH: build/android/${{ inputs.app_name }}.apk
          REPO: ${{ github.repository }}
        run: |
          set -euo pipefail
          TAG="v${{ inputs.version }}"
          if [ ! -f "$APK_PATH" ]; then
            echo "::error::No APK at $APK_PATH — the export step should have produced one."
            exit 1
          fi

          if gh release view "$TAG" --repo "$REPO" >/dev/null 2>&1; then
            echo "Release $TAG already exists — trying to attach the APK."
            if ! gh release upload "$TAG" "$APK_PATH" --repo "$REPO" --clobber; then
              echo "::error::Could not attach the APK: $TAG already exists and published releases are immutable."
              echo "::error::An Apple job created the release first. Order it after this one — needs: [android]."
              exit 1
            fi
          else
            # One call: create + attach. A published release cannot gain assets later.
            gh release create "$TAG" "$APK_PATH" \
              --repo "$REPO" \
              --title "$TAG" \
              --notes "Android APK attached below — debug-signed, so it sideloads directly." \
              --generate-notes \
              --latest
          fi
          echo "APK attached to $TAG"

      - name: Restore export_presets.cfg
        if: always()
        run: git checkout -- export_presets.cfg || true
